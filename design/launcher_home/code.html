<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Minimalist Launcher</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-on-surface": "#303031",
                        "on-secondary-fixed-variant": "#474746",
                        "secondary": "#c8c6c5",
                        "surface-container-low": "#1b1c1c",
                        "surface": "#121414",
                        "surface-tint": "#c6c6c7",
                        "on-primary-fixed": "#1a1c1c",
                        "surface-container-highest": "#343535",
                        "on-error-container": "#ffdad6",
                        "surface-bright": "#383939",
                        "inverse-primary": "#5d5f5f",
                        "on-background": "#e3e2e2",
                        "on-tertiary-fixed-variant": "#454747",
                        "on-primary-fixed-variant": "#454747",
                        "tertiary-fixed": "#e2e2e2",
                        "secondary-fixed": "#e5e2e1",
                        "error": "#ffb4ab",
                        "on-secondary": "#313030",
                        "background": "#121414",
                        "inverse-surface": "#e3e2e2",
                        "surface-container": "#1f2020",
                        "on-secondary-container": "#b7b5b4",
                        "secondary-container": "#474746",
                        "on-surface-variant": "#c4c7c8",
                        "primary-fixed": "#e2e2e2",
                        "surface-dim": "#121414",
                        "outline": "#8e9192",
                        "surface-variant": "#343535",
                        "primary-container": "#e2e2e2",
                        "on-surface": "#e3e2e2",
                        "on-primary": "#2f3131",
                        "tertiary-fixed-dim": "#c6c6c7",
                        "error-container": "#93000a",
                        "on-secondary-fixed": "#1c1b1b",
                        "on-primary-container": "#636565",
                        "on-tertiary-fixed": "#1a1c1c",
                        "secondary-fixed-dim": "#c8c6c5",
                        "outline-variant": "#444748",
                        "on-tertiary": "#2f3131",
                        "primary": "#ffffff",
                        "surface-container-high": "#292a2a",
                        "primary-fixed-dim": "#c6c6c7",
                        "tertiary-container": "#e2e2e2",
                        "on-tertiary-container": "#636565",
                        "tertiary": "#ffffff",
                        "on-error": "#690005",
                        "surface-container-lowest": "#0d0e0f"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter-list": "1.5rem",
                        "margin-page": "2rem",
                        "stack-lg": "3rem",
                        "stack-sm": "0.5rem",
                        "stack-md": "1rem"
                    },
                    "fontFamily": {
                        "label-lg": ["Hanken Grotesk"],
                        "label-sm": ["Hanken Grotesk"],
                        "body-md": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "body-lg": ["Hanken Grotesk"],
                        "headline-md": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "24px", "letterSpacing": "0.01em", "fontWeight": "400" }],
                        "headline-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "300" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "letterSpacing": "0.01em", "fontWeight": "400" }],
                        "headline-md": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-primary min-h-screen flex flex-col font-body-md overflow-hidden antialiased select-none">
<!-- TopAppBar -->
<header class="flex justify-between items-start w-full px-margin-page pt-stack-lg max-w-[600px] mx-auto bg-surface dark:bg-surface docked full-width top-0 z-40 relative"><div>
<h1 class="font-headline-lg text-headline-lg text-primary dark:text-primary">12:45</h1>
<div class="font-label-sm text-label-sm text-outline uppercase tracking-widest mt-1">Tuesday, Oct 24</div>
</div>
<button aria-label="Settings" class="text-primary dark:text-primary hover:bg-surface-container dark:hover:bg-surface-container transition-opacity duration-200 p-2 rounded-full mt-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">settings</span>
</button></header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-[600px] mx-auto px-margin-page flex flex-col pt-12 pb-32 overflow-y-auto hide-scrollbar">
<!-- Subtle Date (Layer 1 typography) -->

<!-- App List (Vertical Rhythm) -->
<ul class="flex flex-col gap-gutter-list w-full">
<li class="">
<button class="w-full text-left font-body-lg text-body-lg text-primary py-2 px-4 -ml-4 transition-colors duration-100 active:bg-primary active:text-background hover:bg-[#1A1A1A] rounded-DEFAULT">
                    Phone
                </button>
</li>
<li class="">
<button class="w-full text-left font-body-lg text-body-lg text-primary py-2 px-4 -ml-4 transition-colors duration-100 active:bg-primary active:text-background hover:bg-[#1A1A1A] rounded-DEFAULT">
                    Messages
                </button>
</li>
<li class="">
<button class="w-full text-left font-body-lg text-body-lg text-primary py-2 px-4 -ml-4 transition-colors duration-100 active:bg-primary active:text-background hover:bg-[#1A1A1A] rounded-DEFAULT">
                    Camera
                </button>
</li>
<li class="">
<button class="w-full text-left font-body-lg text-body-lg text-primary py-2 px-4 -ml-4 transition-colors duration-100 active:bg-primary active:text-background hover:bg-[#1A1A1A] rounded-DEFAULT">
                    Browser
                </button>
</li>
<li class="">
<button class="w-full text-left font-body-lg text-body-lg text-primary py-2 px-4 -ml-4 transition-colors duration-100 active:bg-primary active:text-background hover:bg-[#1A1A1A] rounded-DEFAULT">
                    Maps
                </button>
</li>
<li class="">
<button class="w-full text-left font-body-lg text-body-lg text-primary py-2 px-4 -ml-4 transition-colors duration-100 active:bg-primary active:text-background hover:bg-[#1A1A1A] rounded-DEFAULT">
                    Spotify
                </button>
</li>
</ul>
<!-- Search Bar (Minimalist) -->

</main>
<!-- BottomNavBar -->

<style>
        /* Hide scrollbar for a cleaner look while maintaining functionality */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>




</body></html>
